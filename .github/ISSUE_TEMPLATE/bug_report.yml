name: Bug report
description: Report something broken in the dashboard plugin
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Version of the harness (`npx @deepseek-ai/dsh --version` or shown in the GUI).
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Version from package.json or the npm release you installed.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge (Chromium)
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / log output
      description: Relevant browser console output or harness log lines.
      render: shell
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open the dashboard ... 2. Click ...
    validations:
      required: true
